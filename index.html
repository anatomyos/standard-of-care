<style>
  :root{
    --paper:#fbf4e6; --ink:#2f2a20; --ink-soft:#6b6353; --ink-faint:#9a9280;
    --rule:#ddd2ba; --accent:#8c3e24;
    --serif:"EB Garamond",Georgia,serif; --sans:"Inter",system-ui,sans-serif;
    --measure:34rem;
    --dim:rgba(28,22,14,.66);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
  img{max-width:100%;display:block}
  .col{max-width:var(--measure);margin:0 auto;padding:0 1.5rem}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:1rem;top:1rem;background:var(--ink);color:var(--paper);padding:.6rem 1rem;z-index:99}

  /* ---------- hero ---------- */
  /* ---------- hero: full-bleed image with a frosted panel ---------- */
  .hero{position:relative;min-height:100svh;display:flex;align-items:center;
    justify-content:center;overflow:hidden;padding:0}
  .hero-media{position:absolute;inset:0}
  .hero-media img{width:100%;height:100%;object-fit:cover;display:block}
  .hero-frost{position:absolute;inset:0;z-index:1;
    background:rgba(251,244,230,.44);
    -webkit-backdrop-filter:blur(20px) saturate(112%) brightness(1.05);
    backdrop-filter:blur(20px) saturate(112%) brightness(1.05)}
  .hero-frost::after{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 92% at 50% 46%,rgba(28,22,14,0) 46%,rgba(28,22,14,.20) 100%)}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .hero-frost{background:rgba(251,244,230,.86)}
  }

  .hero-panel{position:relative;z-index:2;max-width:34rem;margin:0 1.5rem;
    padding:0 1rem;text-align:center}
  .hero h1{font-family:var(--serif);font-size:clamp(2.5rem,6vw,4rem);line-height:1.02;
    font-weight:400;margin:0 0 1.1rem;letter-spacing:-.018em;color:var(--ink)}
  .hero .standfirst{font-family:var(--serif);font-size:1.24rem;line-height:1.5;
    color:var(--ink-soft);margin:0}

  .scrollcue{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:2rem;
    font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;margin:0;
    color:rgba(47,42,32,.78);padding:.42rem .95rem;border-radius:999px;
    background:rgba(251,244,230,.6);
    -webkit-backdrop-filter:blur(14px) saturate(120%);
    backdrop-filter:blur(14px) saturate(120%);
    border:1px solid rgba(255,255,255,.5);
    animation:cue 2.8s ease-in-out infinite}
  @keyframes cue{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(4px)}}
  @media (prefers-reduced-motion:reduce){.scrollcue{animation:none}}

  .beat{font-family:var(--serif);font-size:1.25rem;line-height:1.65;color:var(--ink-soft);
    margin:5rem auto 0;max-width:var(--measure);padding:0 1.5rem}

  /* ---------- two-column stage layout ---------- */
  .walk{margin-top:4rem}
  .walk-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,30rem);
    gap:3rem;max-width:82rem;margin:0 auto;padding:0 2rem;align-items:start}

  .stage{position:sticky;top:0;height:100vh;display:flex;align-items:center}
  .stage-inner{position:relative;width:100%;overflow:hidden;border-radius:14px;
    box-shadow:0 10px 34px -16px rgba(28,22,14,.4)}
  .stage-inner img{width:100%;display:block}

  /* soft spotlight: a radial-gradient veil that feathers into the dark */
  .veil{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s ease}
  .veil.on{opacity:1}
  /* ---------- entries ---------- */
  .entry{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:3rem 0}
  .entry-station{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 .5rem}
  .entry h2{font-family:var(--serif);font-weight:500;font-size:2rem;line-height:1.18;margin:0 0 1.4rem}
  .entry figure{margin:0 0 1.6rem;display:none}
  .entry figure img{width:100%}
  blockquote{font-family:var(--serif);font-size:1.24rem;line-height:1.58;
    margin:0 -1.7rem 1.3rem;padding:1.5rem 1.7rem;border-radius:18px;
    background:rgba(255,255,255,.35);
    -webkit-backdrop-filter:blur(16px) saturate(125%);
    backdrop-filter:blur(16px) saturate(125%);
    border:1px solid rgba(255,255,255,.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

    blockquote{background:rgba(255,255,255,.6)}
  }
  .attrib{font-size:.95rem;line-height:1.65;color:var(--ink-soft);margin:0}
  .attrib a{color:var(--accent);text-decoration:none;border-bottom:1px solid #e0c4b8}
  .attrib a:hover{border-bottom-color:var(--accent)}
  .note{font-size:.95rem;line-height:1.65;color:var(--ink-soft);margin:.7rem 0 0}
  .note a{color:var(--accent);text-decoration:none;border-bottom:1px solid #e0c4b8}
  .note-d{margin:.7rem 0 0}
  .note-d summary{display:inline-block;font-size:.72rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-soft);cursor:pointer;list-style:none;
    padding:.32rem .8rem;border:1px solid var(--rule);border-radius:999px;
    transition:background .2s ease,border-color .2s ease}
  .note-d summary:hover{background:rgba(0,0,0,.035);border-color:var(--ink-faint)}
  .note-d summary::before{content:"+ "}
  .note-d[open] summary::before{content:"\u2212 "}
  .note-d summary::-webkit-details-marker{display:none}
  .tk{background:#f6e2b8;color:#6a4a10;padding:.15em .45em;border-radius:2px;
    font-family:var(--sans);font-size:.8em;letter-spacing:.03em}

  .closing{margin:8rem auto 0;max-width:var(--measure);padding:0 1.5rem}
  .closing p{font-family:var(--serif);font-size:1.25rem;line-height:1.65;margin:0 0 1.4rem}
  .sources{margin:6rem auto 0;max-width:var(--measure);padding:3rem 1.5rem 5rem;
    border-top:1px solid var(--rule)}
  .sources h2{font-family:var(--sans);font-size:.78rem;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-faint);font-weight:500;margin:0 0 1.5rem}
  .sources ol{margin:0;padding-left:1.1rem;font-size:.9rem;line-height:1.7;color:var(--ink-soft)}
  .sources li{margin-bottom:.7rem}
  .sources a{color:var(--accent);text-decoration:none;border-bottom:1px solid #e0c4b8}

  .reveal{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease}
  .reveal.in{opacity:1;transform:none}

  /* ---------- narrow screens: room pins to the top, spotlight stays ---------- */
  @media (max-width:900px){
    body{font-size:16px}
    .hero-panel{padding:0 .4rem;margin:0 1rem}
    .walk-grid{display:block;padding:0;max-width:none}
    .stage{position:sticky;top:0;height:auto;display:block;z-index:5;
      background:var(--paper);padding:.6rem .8rem .4rem;
      box-shadow:0 6px 14px -10px rgba(28,22,14,.35)}
    .entry{min-height:78vh;padding:2.5rem 1.5rem;justify-content:flex-start}
    .entry > *{max-width:var(--measure);margin-left:auto;margin-right:auto;width:100%}
    .entry h2{font-size:1.7rem}
    blockquote{margin-left:0;margin-right:0;padding:1.3rem 1.4rem}
    .beat{margin-top:3.5rem}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .reveal{opacity:1;transform:none;transition:none}
    .spot{transition:opacity .2s ease}
  }
</style>
</head>

  '<li>University of Michigan Information and News Service, press bulletin, 12 April 1955. <a href="https://sph.umich.edu/polio">U-M School of Public Health</a></li>' +

/* ---------- spotlight driver: soft veils, crossfaded ---------- */
const veils = [document.getElementById('veil-a'), document.getElementById('veil-b')];
let active = -1, vi = 0;

function veilGradient(s){
  /* ellipse centred on the object, transparent core feathering into the dim */
  const cx = s.x + s.w/2, cy = s.y + s.h/2;
  const rx = Math.max(s.w * 0.95, 6), ry = Math.max(s.h * 0.95, 6);
  return 'radial-gradient(ellipse ' + rx + '% ' + ry + '% at ' + cx + '% ' + cy + '%, ' +
         'rgba(28,22,14,0) 0%, rgba(28,22,14,0) 46%, var(--dim) 100%)';
}

function setSpot(s){
  const next = veils[1 - vi];
  next.style.background = veilGradient(s);
  next.classList.add('on');
  veils[vi].classList.remove('on');
  vi = 1 - vi;
}
window.__setSpot = setSpot; /* used by the preview tuner */

function show(i){
  if (i === active) return;
  active = i;
  const e = ENTRIES[i];
  if (!e) return;
  if (e.spot) setSpot(e.spot);
}

const stageObs = new IntersectionObserver(function(es){
  es.forEach(function(en){ if (en.isIntersecting) show(+en.target.dataset.idx); });
}, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
document.querySelectorAll('.entry').forEach(function(el){ stageObs.observe(el); });

/* ---------- reveal ---------- */
const io = new IntersectionObserver(function(es){
  es.forEach(function(en){
    if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
  });
}, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
</script>
